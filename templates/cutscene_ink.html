<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>STELLO</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=DM+Mono:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:'Playfair Display',serif}

/* ── MAIN STAGE ── */
#stage{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
  cursor:pointer;
  z-index:2;
}

/* ── FADE OUT ── */
#stage.out{animation:stageOut .9s ease forwards;pointer-events:none}
@keyframes stageOut{to{opacity:0}}

/* ── STAR FIELD ── */
#stars{position:fixed;inset:0;z-index:0}

/* ── ECLIPSE WRAPPER ── */
.eclipse-wrap{
  position:relative;
  width:clamp(200px,38vw,420px);
  height:clamp(200px,38vw,420px);
  display:flex;align-items:center;justify-content:center;
  z-index:3;
  animation:eclipseEntry 2.2s cubic-bezier(.16,1,.3,1) forwards;
  opacity:0;
}
@keyframes eclipseEntry{
  0%{opacity:0;transform:scale(0.6) translateY(40px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

/* ── OUTER CORONA RINGS ── */
.corona-ring{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.06);
  animation:coronaPulse 4s ease-in-out infinite;
}
.corona-ring:nth-child(1){inset:-18%;animation-delay:0s}
.corona-ring:nth-child(2){inset:-34%;animation-delay:.4s;border-color:rgba(255,255,255,0.04)}
.corona-ring:nth-child(3){inset:-52%;animation-delay:.8s;border-color:rgba(255,255,255,0.025)}
.corona-ring:nth-child(4){inset:-72%;animation-delay:1.2s;border-color:rgba(255,255,255,0.015)}
@keyframes coronaPulse{
  0%,100%{opacity:.4;transform:scale(1)}
  50%{opacity:1;transform:scale(1.03)}
}

/* ── GLOW AURA ── */
.glow-aura{
  position:absolute;
  inset:-30%;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,255,255,0.22) 0%,
    rgba(220,210,255,0.12) 25%,
    rgba(180,160,255,0.06) 50%,
    transparent 70%
  );
  animation:auraPulse 3s ease-in-out infinite;
}
@keyframes auraPulse{
  0%,100%{opacity:.7;transform:scale(1)}
  50%{opacity:1;transform:scale(1.05)}
}

/* ── ECLIPSE LIGHT BURST ── */
.light-burst{
  position:absolute;
  inset:-5%;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,255,255,0.95) 0%,
    rgba(255,252,240,0.7) 8%,
    rgba(255,240,200,0.3) 18%,
    rgba(200,180,255,0.1) 32%,
    transparent 55%
  );
  animation:burstPulse 2.5s ease-in-out infinite;
  filter:blur(1px);
}
@keyframes burstPulse{
  0%,100%{opacity:.85}
  50%{opacity:1}
}

/* ── MOON CANVAS ── */
#moonCanvas{
  position:relative;
  border-radius:50%;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 0 60px 20px rgba(255,255,255,0.08),
    0 0 120px 40px rgba(200,180,255,0.05),
    inset -30px -20px 60px rgba(0,0,0,0.9);
  z-index:4;
  animation:moonSpin 40s linear infinite;
}
@keyframes moonSpin{to{transform:rotate(360deg)}}

/* ── ECLIPSE EDGE SHINE (the crescent white fire) ── */
.eclipse-shine{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:conic-gradient(
    from 200deg,
    transparent 0deg,
    rgba(255,255,255,0.0) 60deg,
    rgba(255,255,255,0.9) 80deg,
    rgba(255,255,255,1) 90deg,
    rgba(255,255,255,0.9) 100deg,
    rgba(255,255,255,0.0) 120deg,
    transparent 360deg
  );
  border-radius:50%;
  filter:blur(3px);
  z-index:5;
  mix-blend-mode:screen;
  animation:shineRotate 20s linear infinite;
}
@keyframes shineRotate{to{transform:rotate(360deg)}}

/* ── SOLAR FLARES ── */
.flare{
  position:absolute;
  border-radius:50%;
  filter:blur(8px);
  mix-blend-mode:screen;
  animation:flarePulse var(--dur,3s) ease-in-out infinite var(--del,0s);
}
@keyframes flarePulse{
  0%,100%{opacity:0;transform:scale(.8)}
  50%{opacity:.9;transform:scale(1)}
}

/* ── STELLO TEXT ── */
.stello-wrap{
  position:relative;
  z-index:6;
  text-align:center;
  margin-top:clamp(28px,5vw,48px);
  opacity:0;
  animation:textReveal 1.2s cubic-bezier(.16,1,.3,1) 1.4s forwards;
}
@keyframes textReveal{
  0%{opacity:0;transform:translateY(20px) letterSpacing(0)}
  100%{opacity:1;transform:translateY(0)}
}
.stello-text{
  font-size:clamp(44px,9vw,96px);
  font-weight:900;
  letter-spacing:.28em;
  color:transparent;
  background:linear-gradient(180deg,
    #ffffff 0%,
    #f0f0ff 40%,
    rgba(220,210,255,0.8) 70%,
    rgba(180,160,255,0.4) 100%
  );
  -webkit-background-clip:text;
  background-clip:text;
  text-shadow:none;
  position:relative;
}
.stello-text::after{
  content:'STELLO';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0.6),transparent);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:blur(8px);
  opacity:.5;
}
.stello-sub{
  font-family:'DM Mono',monospace;
  font-size:clamp(9px,1.4vw,14px);
  letter-spacing:.55em;
  color:rgba(255,255,255,0.3);
  text-transform:uppercase;
  margin-top:10px;
  font-weight:300;
  opacity:0;
  animation:fadeUp .8s ease 2.4s forwards;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── HINT ── */
.hint{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:.3em;
  color:rgba(255,255,255,0.18);
  text-transform:uppercase;
  white-space:nowrap;
  opacity:0;
  animation:hintPulse 2s ease 4.5s infinite;
  z-index:10;
}
@keyframes hintPulse{
  0%,100%{opacity:0}
  50%{opacity:.6}
}

/* ── SKIP ── */
#skip{
  position:fixed;bottom:22px;right:22px;z-index:999;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;
  color:rgba(255,255,255,0.22);background:none;
  border:1px solid rgba(255,255,255,0.12);padding:7px 14px;
  cursor:pointer;text-transform:uppercase;border-radius:4px;
  transition:all .2s;
  opacity:0;animation:fadeUp .6s ease 1s forwards;
}
#skip:hover{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.3)}

/* ── LENS FLARE STREAKS ── */
.streak{
  position:fixed;
  width:1px;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.06),transparent);
  pointer-events:none;
  animation:streakFade 6s ease-in-out infinite;
  transform-origin:center;
}
@keyframes streakFade{0%,100%{opacity:0}50%{opacity:1}}

/* ── VIGNETTE ── */
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.65) 100%);
}
</style>
</head>
<body>

<!-- Stars -->
<canvas id="stars" style="position:fixed;inset:0;z-index:0"></canvas>

<!-- Vignette -->
<div class="vignette"></div>

<!-- Skip -->
<button id="skip" onclick="enter()">skip ↗</button>

<!-- Main Stage -->
<div id="stage">
  <div class="eclipse-wrap" id="eclipseWrap">

    <!-- Corona rings -->
    <div class="corona-ring"></div>
    <div class="corona-ring"></div>
    <div class="corona-ring"></div>
    <div class="corona-ring"></div>

    <!-- Glow aura -->
    <div class="glow-aura"></div>

    <!-- Light burst (eclipse corona) -->
    <div class="light-burst"></div>

    <!-- Solar flares -->
    <div class="flare" id="fl1"></div>
    <div class="flare" id="fl2"></div>
    <div class="flare" id="fl3"></div>

    <!-- Moon -->
    <canvas id="moonCanvas"></canvas>

    <!-- Eclipse shine (crescent edge fire) -->
    <div class="eclipse-shine"></div>

  </div>

  <!-- STELLO Text -->
  <div class="stello-wrap">
    <div class="stello-text">STELLO</div>
    <div class="stello-sub">your intelligence · your universe</div>
  </div>
</div>

<!-- Hint -->
<div class="hint">— touch to enter —</div>

<script>
// ── STAR FIELD ──────────────────────────────────────────────
const sc = document.getElementById('stars');
const sctx = sc.getContext('2d');
let W, H, stars = [];

function initStars() {
  W = sc.width = innerWidth;
  H = sc.height = innerHeight;
  stars = Array.from({length: 280}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.6 + 0.2,
    alpha: Math.random() * 0.8 + 0.1,
    speed: Math.random() * 0.4 + 0.05,
    twinkle: Math.random() * Math.PI * 2,
    tSpeed: Math.random() * 0.015 + 0.005,
    color: Math.random() > 0.85
      ? `hsl(${220 + Math.random()*60},80%,90%)`
      : '#fff',
  }));
}

// Shooting stars
let shooters = [];
function spawnShooter() {
  shooters.push({
    x: Math.random() * W * 0.7,
    y: Math.random() * H * 0.4,
    len: Math.random() * 180 + 80,
    speed: Math.random() * 12 + 8,
    alpha: 1,
    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
    life: 1,
  });
}

let lastShoot = 0;
function drawStars(ts) {
  sctx.clearRect(0, 0, W, H);

  // Draw stars
  stars.forEach(s => {
    s.twinkle += s.tSpeed;
    const a = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sctx.fillStyle = s.color;
    sctx.globalAlpha = a;
    sctx.fill();
  });

  // Shooting stars
  if (ts - lastShoot > 3500 && Math.random() > 0.5) {
    spawnShooter(); lastShoot = ts;
  }
  shooters = shooters.filter(sh => sh.life > 0);
  shooters.forEach(sh => {
    sh.life -= 0.02;
    sh.x += Math.cos(sh.angle) * sh.speed;
    sh.y += Math.sin(sh.angle) * sh.speed;
    const tail = {
      x: sh.x - Math.cos(sh.angle) * sh.len,
      y: sh.y - Math.sin(sh.angle) * sh.len,
    };
    const grad = sctx.createLinearGradient(tail.x, tail.y, sh.x, sh.y);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(1, `rgba(255,255,255,${sh.life * 0.9})`);
    sctx.beginPath();
    sctx.moveTo(tail.x, tail.y);
    sctx.lineTo(sh.x, sh.y);
    sctx.strokeStyle = grad;
    sctx.lineWidth = 1.5;
    sctx.stroke();
  });

  sctx.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
initStars();
addEventListener('resize', initStars);
requestAnimationFrame(drawStars);

// ── MOON CANVAS ──────────────────────────────────────────────
const moon = document.getElementById('moonCanvas');
const mctx = moon.getContext('2d');
const SIZE = Math.min(innerWidth * 0.35, 380);
moon.width = moon.height = SIZE;
moon.style.width = moon.style.height = SIZE + 'px';

function drawMoon() {
  const s = SIZE;
  const cx = s / 2, cy = s / 2, r = s * 0.46;
  mctx.clearRect(0, 0, s, s);

  // Moon base
  const moonGrad = mctx.createRadialGradient(cx - r*0.2, cy - r*0.15, r*0.05, cx, cy, r);
  moonGrad.addColorStop(0, '#d8d8e8');
  moonGrad.addColorStop(0.3, '#b8b8cc');
  moonGrad.addColorStop(0.65, '#888898');
  moonGrad.addColorStop(0.85, '#555566');
  moonGrad.addColorStop(1, '#222230');
  mctx.beginPath();
  mctx.arc(cx, cy, r, 0, Math.PI * 2);
  mctx.fillStyle = moonGrad;
  mctx.fill();

  // Craters
  const craters = [
    {x:.38,y:.35,r:.09,d:.7},{x:.6,y:.25,r:.06,d:.6},
    {x:.28,y:.6,r:.07,d:.65},{x:.65,y:.55,r:.05,d:.6},
    {x:.45,y:.7,r:.08,d:.7},{x:.22,y:.42,r:.04,d:.55},
    {x:.7,y:.38,r:.035,d:.5},{x:.55,y:.45,r:.06,d:.6},
    {x:.35,y:.22,r:.04,d:.5},{x:.42,y:.52,r:.03,d:.5},
    {x:.6,y:.68,r:.04,d:.55},{x:.25,y:.75,r:.03,d:.5},
  ];

  craters.forEach(c => {
    const cx2 = cx - r + c.x * r * 2;
    const cy2 = cy - r + c.y * r * 2;
    const cr = c.r * r;
    const dist = Math.sqrt((cx2-cx)**2+(cy2-cy)**2);
    if(dist + cr > r * 0.95) return;

    // Shadow
    mctx.beginPath();
    mctx.arc(cx2 + cr*0.15, cy2 + cr*0.15, cr, 0, Math.PI*2);
    mctx.fillStyle = `rgba(0,0,0,${c.d*0.5})`;
    mctx.fill();

    // Crater floor
    const cg = mctx.createRadialGradient(cx2-cr*.2,cy2-cr*.2,0,cx2,cy2,cr);
    cg.addColorStop(0, `rgba(180,180,195,${c.d*0.4})`);
    cg.addColorStop(0.6, `rgba(100,100,115,${c.d*0.3})`);
    cg.addColorStop(1, `rgba(30,30,45,${c.d*0.5})`);
    mctx.beginPath();
    mctx.arc(cx2, cy2, cr, 0, Math.PI*2);
    mctx.fillStyle = cg;
    mctx.fill();

    // Rim highlight
    mctx.beginPath();
    mctx.arc(cx2 - cr*.3, cy2 - cr*.3, cr*0.25, 0, Math.PI*2);
    mctx.fillStyle = `rgba(255,255,255,${c.d*0.08})`;
    mctx.fill();
  });

  // Maria (dark regions)
  const marias = [
    {x:.52,y:.48,rx:.18,ry:.12,a:-.3},{x:.38,y:.52,rx:.12,ry:.08,a:.5},
    {x:.6,y:.62,rx:.1,ry:.07,a:-.1},{x:.3,y:.35,rx:.08,ry:.05,a:.2},
  ];
  mctx.save();
  marias.forEach(m => {
    const mx = cx - r + m.x*r*2, my = cy - r + m.y*r*2;
    mctx.save();
    mctx.translate(mx, my);
    mctx.rotate(m.a);
    mctx.beginPath();
    mctx.ellipse(0, 0, m.rx*r, m.ry*r, 0, 0, Math.PI*2);
    mctx.fillStyle = 'rgba(30,30,50,0.22)';
    mctx.fill();
    mctx.restore();
  });
  mctx.restore();

  // Terminator (shadow side - eclipse dark)
  const shadowGrad = mctx.createRadialGradient(cx + r*.55, cy, 0, cx + r*.3, cy, r*1.1);
  shadowGrad.addColorStop(0, 'rgba(0,0,0,0.0)');
  shadowGrad.addColorStop(0.35, 'rgba(0,0,0,0.15)');
  shadowGrad.addColorStop(0.65, 'rgba(0,0,0,0.6)');
  shadowGrad.addColorStop(0.85, 'rgba(0,0,0,0.88)');
  shadowGrad.addColorStop(1, 'rgba(0,0,0,0.95)');
  mctx.beginPath();
  mctx.arc(cx, cy, r, 0, Math.PI*2);
  mctx.fillStyle = shadowGrad;
  mctx.fill();

  // Edge glow (the eclipse halo at edge)
  mctx.beginPath();
  mctx.arc(cx, cy, r, 0, Math.PI*2);
  mctx.strokeStyle = 'rgba(255,255,255,0.06)';
  mctx.lineWidth = 1;
  mctx.stroke();

  // Clip to circle
  mctx.globalCompositeOperation = 'destination-in';
  mctx.beginPath();
  mctx.arc(cx, cy, r, 0, Math.PI*2);
  mctx.fillStyle = '#000';
  mctx.fill();
  mctx.globalCompositeOperation = 'source-over';
}
drawMoon();

// ── SOLAR FLARES ─────────────────────────────────────────────
const flarePos = [
  {id:'fl1', top:'10%', left:'62%', w:'22%', h:'22%', bg:'rgba(255,240,180,0.35)', dur:'2.8s', del:'0s'},
  {id:'fl2', top:'60%', left:'15%', w:'18%', h:'18%', bg:'rgba(200,180,255,0.25)', dur:'3.4s', del:'.8s'},
  {id:'fl3', top:'20%', left:'18%', w:'14%', h:'14%', bg:'rgba(255,255,255,0.2)',  dur:'2.2s', del:'1.4s'},
];
flarePos.forEach(f => {
  const el = document.getElementById(f.id);
  el.style.cssText = `
    top:${f.top};left:${f.left};
    width:${f.w};height:${f.h};
    background:radial-gradient(circle,${f.bg},transparent 70%);
    --dur:${f.dur};--del:${f.del};
  `;
});

// ── ENTER ────────────────────────────────────────────────────
let canEnter = false, entered = false;
setTimeout(() => canEnter = true, 2000);
setTimeout(() => enter(), 9000);

document.getElementById('stage').addEventListener('click', () => { if(canEnter) enter(); });
document.addEventListener('keydown', e => { if(['Enter',' '].includes(e.key) && canEnter) enter(); });

function enter() {
  if(entered) return; entered = true;
  document.getElementById('skip').style.display = 'none';
  document.getElementById('stage').classList.add('out');
  setTimeout(() => window.location.href = '/login', 900);
}

addEventListener('resize', () => { initStars(); });
</script>
</body>
</html>
